version: 0.1
component: build
timeoutInSeconds: 6000
shell: bash
steps:
  - type: Command
    name: "Install Dependencies"
    command: "pip3 install pytest"
  - type: Command
    name: "Run Regression Tests"
    command: "python3 -m pytest test_app.py -v"
  - type: Command
    name: "Package Application"
    command: "zip -r noticeboard.zip . -x '*.git*'"
outputArtifacts:
  - name: app_zip
    type: BINARY
    location: noticeboard.zip
